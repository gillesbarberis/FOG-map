<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020406"><title>FOG — Musical geography</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="./" aria-label="FOG Map, vista iniziale">FOG</a><div class="strap">MUSIC <b>/</b> PEOPLE <b>/</b> PLACES <b>/</b> NETWORKS</div><div class="legend"><span><i class="gold"></i> LABEL / FESTIVAL</span><span><i class="white"></i> ARTIST / PRODUCER</span><span><i class="ring"></i> FOG PROJECT</span></div></header>
<main><section class="world" aria-label="Mappa interattiva"><canvas id="earth" aria-hidden="true"></canvas><canvas id="map" aria-label="Globo terrestre interattivo: trascina per ruotare. Tutti gli elementi sono accessibili anche con il pulsante Esplora."></canvas>
<div class="explore-wrap"><button id="explore" aria-expanded="false" aria-controls="explorer"><span>⌕</span> ESPLORA LA RETE <span id="total">71</span></button><section id="explorer" hidden><div class="explorer-top"><label for="search">CERCA NELLA RETE</label><button id="close-search" aria-label="Chiudi ricerca">×</button></div><input id="search" type="search" placeholder="Artista, label, paese…" autocomplete="off"><div class="filter-row"><label for="type">Tipo</label><select id="type"><option value="all">Tutti</option><option value="label">Labels</option><option value="artist">Artisti</option><option value="festival">Festival</option><option value="project">Progetti</option></select></div><p id="count" aria-live="polite"></p><div id="results"></div></section></div>
<div class="map-bottom"><div class="nav"><button id="west" aria-label="Ruota verso ovest">‹</button><button id="east" aria-label="Ruota verso est">›</button><button id="reset" aria-label="Ripristina vista">◎</button><span>TRASCINA PER ESPLORARE</span></div><div id="coordinates">LAT 25.0° &nbsp; LON −20.0°</div></div><div class="zoom"><button id="plus" aria-label="Ingrandisci">+</button><button id="minus" aria-label="Riduci">−</button></div><div class="loading" id="loading">CARICAMENTO DEL GLOBO</div>
</section><aside id="panel" aria-label="Dettagli della rete"><div id="detail" aria-live="polite"></div></aside></main>
<footer><span>FOG ATLAS <span class="muted">/</span> V0.2</span><span>10 LUOGHI V0 <span class="muted">·</span> 61 GEOGRAFIE DA VERIFICARE</span><a href="https://github.com/gillesbarberis/FOG-map#stato-dei-dati" target="_blank" rel="noopener">DATI & FONTI ↗</a></footer>
<script src="app.js"></script></body></html>
